# Illustrative TT-like shape. Counts and capacities are concrete because the
# ADL exporter and Loom hardware discovery require concrete structure.
dimensions:
  dram_channel: 8
  x: 8
  y: 8
  l1_bank: 16

architecture:
  name: dual_noc_system
  groups:
    - name: mesh
      scale: [x, y]
  memories:
    - name: DRAM
      bank_name: DRAM_channel
      block_size_bytes: 8192
      num_blocks: 196608
      scale: [dram_channel]
    - name: L1
      in: mesh
      bank_name: L1_bank
      block_size_bytes: 16
      num_blocks: 5464
      scale: [l1_bank]
    - name: L1_mesh
      of: L1
      across: mesh
  processors:
    # Loom currently generates direct DRAM/L1 transfers. NoC0 carries loads
    # and inter-core gathers; NoC1 carries stores.
    - name: dram_l1_noc0
      kind: data_mover
      from: DRAM
      to: L1_mesh
      resources: [noc0]
    - name: l1_l1_noc0
      kind: data_mover
      from: L1_mesh
      to: L1_mesh
      resources: [noc0]
    - name: l1_dram_noc1
      kind: data_mover
      from: L1_mesh
      to: DRAM
      resources: [noc1]
    - name: matrix_lane
      in: mesh
      kind: compute
      from: L1
      to: L1
    - name: vector_lane
      in: mesh
      kind: compute
      from: L1
      to: L1
