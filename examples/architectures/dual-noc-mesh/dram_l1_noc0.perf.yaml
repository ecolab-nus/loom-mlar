time_costs:
  unicast: &unicast
    simple:
      fixed_latency: "454"
      volume: "M * N * 2 * effective_bandwidth"
      throughput: "150"
  broadcast: &broadcast
    simple:
      fixed_latency: "344"
      volume: "M * N * 2 * effective_bandwidth"
      throughput: "150"
  remote: &remote
    simple:
      fixed_latency: "888"
      volume: "M * N * 2 * effective_bandwidth"
      throughput: "888"

functions:
  dram_to_l1_S_f16:
    scenarios:
      - time_cost: *unicast

  dram_to_l1_S_bcst:
    symbols: [M, N, bcst_x, bcst_y, effective_bandwidth]
    scenarios:
      - time_cost: *broadcast

  dram_to_l1_R_f16:
    scenarios:
      - time_cost: *remote

  dram_to_l1_R_bcst:
    symbols: [M, N, bcst_x, bcst_y, effective_bandwidth]
    scenarios:
      - time_cost: *remote
