name: torus_system
dimensions:
  dram_channel: 4
  x: 4
  y: 4
memories:
  DRAM: [dram_channel]
  L1: [x, y]
resources:
  - name: noc_ingress
  - name: noc_egress
  - name: l1_torus_x
  - name: l1_torus_y
processor:
  matrix_lane.yaml:
    - inputs: ["L1[x, y]"]
      outputs: ["L1[x, y]"]
  dram_l1_dma.yaml:
    - inputs: ["DRAM[:]"]
      outputs: ["mesh_l1"]
      resources: [noc_ingress]
  l1_dram_dma.yaml:
    - inputs: ["mesh_l1"]
      outputs: ["DRAM[:]"]
      resources: [noc_egress]
