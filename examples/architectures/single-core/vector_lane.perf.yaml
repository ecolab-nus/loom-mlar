# Costs evaluate to cycles. Work is elements; throughput is elements/cycle.
time_costs:
  short_vector: &short_vector
    simple:
      fixed_latency: "2"
      volume: "L"
      throughput: "32"
  long_vector: &long_vector
    simple:
      # Higher setup cost avoids a backwards latency jump at the crossover.
      fixed_latency: "18"
      volume: "L"
      throughput: "64"

functions:
  vector_add:
    symbols: [L]
    constraints: "L > 0"
    scenarios:
      - constraints: "L <= 1024"
        time_cost: *short_vector
      - constraints: "L > 1024"
        time_cost: *long_vector
