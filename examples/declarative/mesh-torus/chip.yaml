name: torus_system
dimensions:
  dram_channel: 4
  x: 4
  y: 4
memories:
  DRAM:
  - dram_channel
  L1:
  - x
  - y
resources:
- name: noc_ingress
- name: noc_egress
- name: l1_torus_x
- name: l1_torus_y
networks:
- name: l1_torus
  dimensions:
  - x
  - y
  resources:
  - name: x_links
  - name: y_links
  links:
  - name: east
    map: '[x, y] -> [x, y]: ((x + 1) mod 4, y)'
    bandwidth: torus_link_bandwidth
    resource: x_links
  - name: west
    map: '[x, y] -> [x, y]: ((x + 3) mod 4, y)'
    bandwidth: torus_link_bandwidth
    resource: x_links
  - name: north
    map: '[x, y] -> [x, y]: (x, (y + 1) mod 4)'
    bandwidth: torus_link_bandwidth
    resource: y_links
  - name: south
    map: '[x, y] -> [x, y]: (x, (y + 3) mod 4)'
    bandwidth: torus_link_bandwidth
    resource: y_links
  interfaces:
  - name: l1
    endpoint: mesh_l1
scopes:
- name: mesh
  dimensions:
  - x
  - y
  memories:
  - L1
  processors:
  - matrix_lane
  networks:
  - l1_torus
processors:
  matrix_lane:
    definition: matrix_lane.yaml
    domain:
    - x
    - y
    inputs:
    - L1[x, y]
    outputs:
    - L1[x, y]
  dram_l1_dma:
    definition: dram_l1_dma.yaml
    domain: []
    inputs:
    - DRAM[:]
    outputs:
    - mesh_l1
    resources:
    - noc_ingress
  l1_dram_dma:
    definition: l1_dram_dma.yaml
    domain: []
    inputs:
    - mesh_l1
    outputs:
    - DRAM[:]
    resources:
    - noc_egress
