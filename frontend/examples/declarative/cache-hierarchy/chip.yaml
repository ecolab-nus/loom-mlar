name: cache_system
dimensions:
  dram_channel: 2
  cluster: 2
  core: 4
memories:
  DRAM: [dram_channel]
  L2: [cluster]
  L1: [cluster, [core]]
resources:
- name: memory_fabric
- name: l2_fabric
processors:
  core_lane:
    definition: core_lane.yaml
    domain: [cluster, core]
    inputs: {data: "L1[cluster][core]"}
    outputs: {result: "L1[cluster][core]"}
  dram_l2_dma:
    definition: dram_l2_dma.yaml
    inputs: {src: "DRAM[:]"}
    outputs: {dst: "L2[:]"}
    resources: [memory_fabric]
  l2_l1_dma:
    definition: l2_l1_dma.yaml
    domain: [cluster]
    inputs: {src: "L2[cluster]"}
    outputs: {dst: "L1[cluster]"}
    resources: [memory_fabric, l2_fabric]
  l1_l2_dma:
    definition: l1_l2_dma.yaml
    domain: [cluster]
    inputs: {src: "L1[cluster]"}
    outputs: {dst: "L2[cluster]"}
    resources: [memory_fabric, l2_fabric]
