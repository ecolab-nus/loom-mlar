name: dual_noc_system
dimensions:
  dram_channel: 8
  x: 8
  y: 8
memories:
  DRAM: {domain: DRAM, axes: [dram_channel]}
  L1: {domain: L1, axes: [x, y]}
resources:
- name: noc0
- name: noc1
processors:
  matrix_lane:
    definition: matrix_lane.yaml
    domain: [x, y]
    inputs: {lhs: "L1[x, y]", rhs: "L1[x, y]"}
    outputs: {result: "L1[x, y]"}
  vector_lane:
    definition: vector_lane.yaml
    domain: [x, y]
    inputs: {input: "L1[x, y]"}
    outputs: {result: "L1[x, y]"}
  dram_l1_noc0:
    definition: dram_l1_noc0.yaml
    inputs: {src: "DRAM[:]"}
    outputs: {dst: "L1[:, :]"}
    resources: [noc0]
  l1_l1_noc0:
    definition: l1_l1_noc0.yaml
    inputs: {src: "L1[:, :]"}
    outputs: {dst: "L1[:, :]"}
    resources: [noc0]
  l1_dram_noc1:
    definition: l1_dram_noc1.yaml
    inputs: {src: "L1[:, :]"}
    outputs: {dst: "DRAM[:]"}
    resources: [noc1]
