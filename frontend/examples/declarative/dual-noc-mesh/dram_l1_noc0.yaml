name: dram_l1_noc0
type: data_mover
functions:
  dram_to_l1_f16: {source: dram_to_l1_f16}
  dram_to_l1_broadcast_f16: {source: dram_to_l1_broadcast_f16}
performance:
  dram_to_l1_f16:
  - {latency: '40', volume: 2 * M * N, throughput: '128'}
  dram_to_l1_broadcast_f16:
  - {latency: '40', volume: 2 * M * N * bcst_x * bcst_y, throughput: '128'}
