name: matrix_lane
type: compute
functions:
  matmul_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings: {lhs: lhs, rhs: rhs, out: result}
resources:
- name: matrix_pipeline
performance:
  matmul_f16:
  - constraint: M >= 16 && N >= 16 && K >= 16
    latency: '8'
    volume: 2 * M * N * K
    throughput: '512'
