name: matrix_lane
type: compute
functions:
  matmul_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings: {lhs: lhs, rhs: rhs, out: result}
  batch_matmul_f16:
    source: batch_matmul_accumulate
    element_type: f16
    dimensions: [B, M, N, K]
    bindings: {lhs: lhs, rhs: rhs, out: result}
  vec_vsum_f16:
    source: reduce_last_sum
    element_type: f16
    dimensions: [P, R]
    bindings: {input: lhs, out: result}
  vec_vmax_f16:
    source: reduce_last_max
    element_type: f16
    dimensions: [P, R]
    bindings: {input: lhs, out: result}
  vec_max1_f16:
    source: vec_max1_f16
  elementwise_add_f16:
    source: elementwise_add
    element_type: f16
    dimensions: [M, N]
    bindings: {lhs: lhs, rhs: rhs, out: result}
  elementwise_mul_f16:
    source: elementwise_mul
    element_type: f16
    dimensions: [M, N]
    bindings: {lhs: lhs, rhs: rhs, out: result}
resources:
- name: matrix_pipeline
performance:
  matmul_f16:
  - constraint: (M >= 32 && N >= 32 && K >= 32) && (M * N >= 8192)
    latency: M * N / 2
    volume: 2 * M * N * K
    throughput: '716'
  - constraint: (M >= 32 && N >= 32 && K >= 32) && (M * N < 8192)
    latency: M * N / 2
    volume: 2 * M * N * K
    throughput: M * N * 716 / 8192
  batch_matmul_f16:
  - constraint: (B >= 1 && M >= 32 && N >= 32 && K >= 32) && (M * N >= 8192)
    latency: M * N / 2
    volume: 2 * B * M * N * K
    throughput: '716'
  - constraint: (B >= 1 && M >= 32 && N >= 32 && K >= 32) && (M * N < 8192)
    latency: M * N / 2
    volume: 2 * B * M * N * K
    throughput: M * N * 716 / 8192
  vec_vsum_f16:
  - latency: '1'
    volume: P * R
    throughput: '128'
  vec_vmax_f16:
  - latency: '1'
    volume: P * R
    throughput: '128'
  vec_max1_f16:
  - latency: '1'
    volume: L
    throughput: '128'
  elementwise_add_f16:
  - latency: '10'
    volume: M * N
    throughput: '43'
  elementwise_mul_f16:
  - latency: '10'
    volume: M * N
    throughput: '15'
