name: matrix_lane
type: compute
functions:
  matmul_SS_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings: {lhs: L1_S, rhs: L1_S, out: L1_S}
  matmul_SR_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings: {lhs: L1_S, rhs: L1_R, out: L1_S}
  matmul_RS_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings: {lhs: L1_R, rhs: L1_S, out: L1_S}
  matmul_RR_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings: {lhs: L1_R, rhs: L1_R, out: L1_S}
  batch_matmul_SS_f16:
    source: batch_matmul_accumulate
    element_type: f16
    dimensions: [B, M, N, K]
    bindings: {lhs: L1_S, rhs: L1_S, out: L1_S}
  batch_matmul_SR_f16:
    source: batch_matmul_accumulate
    element_type: f16
    dimensions: [B, M, N, K]
    bindings: {lhs: L1_S, rhs: L1_R, out: L1_S}
  batch_matmul_RS_f16:
    source: batch_matmul_accumulate
    element_type: f16
    dimensions: [B, M, N, K]
    bindings: {lhs: L1_R, rhs: L1_S, out: L1_S}
  batch_matmul_RR_f16:
    source: batch_matmul_accumulate
    element_type: f16
    dimensions: [B, M, N, K]
    bindings: {lhs: L1_R, rhs: L1_R, out: L1_S}
  vec_vsum_f16:
    source: reduce_last_sum
    element_type: f16
    dimensions: [P, R]
    bindings: {input: L1_S, out: L1_S}
  vec_vmax_f16:
    source: reduce_last_max
    element_type: f16
    dimensions: [P, R]
    bindings: {input: L1_S, out: L1_S}
  vec_max1_f16:
    source: elementwise_max
    element_type: f16
    dimensions: [L]
    bindings: {lhs: L1_S, rhs: L1_S, out: L1_S}
  elementwise_add_f16:
    source: elementwise_add
    element_type: f16
    dimensions: [M, N]
    bindings: {lhs: L1_S, rhs: L1_S, out: L1_S}
  elementwise_mul_f16:
    source: elementwise_mul
    element_type: f16
    dimensions: [M, N]
    bindings: {lhs: L1_S, rhs: L1_S, out: L1_S}
resources:
- name: matrix_lane
performance:
  matmul_SS_f16:
  - constraint: (M >= 32 && N >= 32 && K >= 32) && (M * N >= 8192)
    latency: M * N / 2
    volume: 2 * M * N * K
    throughput: '716'
  - constraint: (M >= 32 && N >= 32 && K >= 32) && (M * N < 8192)
    latency: M * N / 2
    volume: 2 * M * N * K
    throughput: M * N * 716 / 8192
  matmul_SR_f16:
  - constraint: M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * M * N * K
    throughput: '888'
  matmul_RS_f16:
  - constraint: M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * M * N * K
    throughput: '888'
  matmul_RR_f16:
  - constraint: M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * M * N * K
    throughput: '888'
  batch_matmul_SS_f16:
  - constraint: (B >= 1 && M >= 32 && N >= 32 && K >= 32) && (M * N >= 8192)
    latency: M * N / 2
    volume: 2 * B * M * N * K
    throughput: '716'
  - constraint: (B >= 1 && M >= 32 && N >= 32 && K >= 32) && (M * N < 8192)
    latency: M * N / 2
    volume: 2 * B * M * N * K
    throughput: M * N * 716 / 8192
  batch_matmul_SR_f16:
  - constraint: B >= 1 && M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * B * M * N * K
    throughput: '888'
  batch_matmul_RS_f16:
  - constraint: B >= 1 && M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * B * M * N * K
    throughput: '888'
  batch_matmul_RR_f16:
  - constraint: B >= 1 && M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * B * M * N * K
    throughput: '888'
  vec_vsum_f16:
  - latency: '1'
    volume: P * R
    throughput: '128'
  vec_vmax_f16:
  - latency: '1'
    volume: P * R
    throughput: '128'
  vec_max1_f16:
  - latency: '1'
    volume: L
    throughput: '128'
  elementwise_add_f16:
  - latency: '10'
    volume: M * N
    throughput: '43'
  elementwise_mul_f16:
  - latency: '10'
    volume: M * N
    throughput: '15'
