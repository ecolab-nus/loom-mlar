name: matrix_lane
type: compute
functions:
  matmul:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
resources:
- name: matrix_pipeline
- name: matrix_lane
performance:
  matmul:
  - constraint: M > 0 && N > 0 && K > 0
    latency: '16'
    volume: 2 * M * N * K
    throughput: '128'
