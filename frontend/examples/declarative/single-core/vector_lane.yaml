name: vector_lane
type: compute
functions:
  vector_add:
    source: elementwise_add
    element_type: f16
    dimensions: [L]
resources:
- name: vector_pipeline
- name: vector_lane
performance:
  vector_add:
  - constraint: (L > 0) && (L <= 1024)
    latency: '2'
    volume: L
    throughput: '32'
  - constraint: (L > 0) && (L > 1024)
    expression: '18 + L / 64'
