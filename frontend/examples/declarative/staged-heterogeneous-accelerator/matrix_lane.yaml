name: matrix_lane
type: compute
functions:
  matmul_staged_f16_f32:
    source: matmul_staged_f16_f32
    element_type: f16
    dimensions: [M, N, K]
    bindings: {stage_a: stage_a, stage_b: stage_b, result: result}
performance:
  matmul_staged_f16_f32:
  - expression: "8 + max((M * N * K + 255) / 256, max((2 * (M * K + K * N) + 31) / 32, (4 * M * N + 15) / 16))"
