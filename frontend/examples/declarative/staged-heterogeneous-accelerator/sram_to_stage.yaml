name: sram_to_stage
type: data_mover
functions:
  load_sram_f16:
    source: copy
    element_type: f16
    dimensions: [M, K]
  load_sram_f16_broadcast:
    source: broadcast
    element_type: f16
    dimensions: [M, K]
    symbols: [bcst_x, bcst_y]
    extent: [bcst_x, bcst_y]
performance:
  load_sram_f16:
  - expression: "8 + (2 * M * K + 15) / 16"
  load_sram_f16_broadcast:
  - expression: "8 + (2 * M * K * bcst_x * bcst_y + 15) / 16"
