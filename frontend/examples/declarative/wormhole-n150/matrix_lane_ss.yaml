name: matrix_lane_ss
type: compute
functions:
  matmul_f16: {source: matmul_f16, bindings: {lhs: lhs, rhs: rhs, result: result}}
  batch_matmul_f16: {source: batch_matmul_f16, bindings: {lhs: lhs, rhs: rhs, result: result}}
performance:
  # HiFi2, one core, measured on n150 (2026-11-02): T = 684 + MN/13.4 + 2K(M+N)/27.7 + 2MNK/1773 per call, fitted to
  # 32x32..256x256 output blocks (effective 319..1172 FLOP/cycle). Batched: every term x B (B separate calls).
  matmul_f16:
  - constraint: M >= 32 && N >= 32 && K >= 32
    latency: 684 + M * N * 10 / 134 + 2 * K * (M + N) * 10 / 277
    volume: 2 * M * N * K
    throughput: '1773'
  batch_matmul_f16:
  - constraint: B >= 1 && M >= 32 && N >= 32 && K >= 32
    latency: B * (684 + M * N * 10 / 134 + 2 * K * (M + N) * 10 / 277)
    volume: 2 * B * M * N * K
    throughput: '1773'
