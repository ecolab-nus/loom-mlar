name: matrix_lane_rr
type: compute
functions:
  matmul_f16: {source: matmul_f16, bindings: {lhs: lhs, rhs: rhs, result: result}}
  batch_matmul_f16: {source: batch_matmul_f16, bindings: {lhs: lhs, rhs: rhs, result: result}}
performance:
  matmul_f16:
  - constraint: M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * M * N * K
    throughput: '888'
  batch_matmul_f16:
  - constraint: B >= 1 && M >= 32 && N >= 32 && K >= 32
    latency: '888'
    volume: 2 * B * M * N * K
    throughput: '888'
