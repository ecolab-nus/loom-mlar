name: matrix_lane_ss
type: compute
functions:
  matmul_f16: {source: matmul_f16}
  batch_matmul_f16: {source: batch_matmul_f16}
performance:
  matmul_f16:
  - constraint: (M >= 32 && N >= 32 && K >= 32) && (M * N >= 8192)
    latency: M * N / 2
    volume: 2 * M * N * K
    throughput: '716'
  - constraint: (M >= 32 && N >= 32 && K >= 32) && (M * N < 8192)
    latency: M * N / 2
    volume: 2 * M * N * K
    throughput: M * N * 716 / 8192
  batch_matmul_f16:
  - constraint: (B >= 1 && M >= 32 && N >= 32 && K >= 32) && (M * N >= 8192)
    latency: M * N / 2
    volume: 2 * B * M * N * K
    throughput: '716'
  - constraint: (B >= 1 && M >= 32 && N >= 32 && K >= 32) && (M * N < 8192)
    latency: M * N / 2
    volume: 2 * B * M * N * K
    throughput: M * N * 716 / 8192
