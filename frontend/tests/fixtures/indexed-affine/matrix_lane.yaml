name: matrix_lane
type: compute
functions:
  matmul_f16:
    source: matmul_accumulate
    element_type: f16
    dimensions: [M, N, K]
    bindings:
      lhs: lhs
      rhs: rhs
      out: result
resources:
- name: matrix
performance:
  matmul_f16:
  - constraint: M > 0 && N > 0 && K > 0
    latency: '4'
    volume: 2 * M * N * K
    throughput: '512'
