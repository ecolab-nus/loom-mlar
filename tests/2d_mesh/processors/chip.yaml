name: system
memory: memory.yaml

dimensions:
  dram_channel: 8
  x: 8
  y: 8

memories:
  DRAM: [dram_channel]
  L1: [x, y]

resources:
  - name: noc0
  - name: noc1

processor:
  matrix_lane.yaml:
    - inputs: ["L1[x, y]"]
      outputs: ["L1[x, y]"]
  vector_lane.yaml:
    - inputs: ["L1[x, y]"]
      outputs: ["L1[x, y]"]
  dram_l1_noc0.yaml:
    - inputs: ["DRAM[:]"]
      outputs: ["all_l1"]
      resources: [noc0]
  l1_l1_noc0.yaml:
    - inputs: ["all_l1"]
      outputs: ["all_l1"]
      resources: [noc0]
  l1_dram_noc1.yaml:
    - inputs: ["all_l1"]
      outputs: ["DRAM[:]"]
      resources: [noc1]
