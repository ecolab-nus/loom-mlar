name: matrix_lane
type: compute
source: matrix_lane.loom
resources:
  - name: matrix_lane
performance:
  time_costs:
    elementwise_add_f16: &elementwise_add_f16
      simple:
        fixed_latency: "10"
        volume: "M * N"
        throughput: "43"
    elementwise_mul_f16: &elementwise_mul_f16
      simple:
        fixed_latency: "10"
        volume: "M * N"
        throughput: "15"
    vector_reduce_f16: &vector_reduce_f16
      simple:
        fixed_latency: "1"
        volume: "P * R"
        throughput: "128"
    vec_max1_f16: &vec_max1_f16
      simple:
        fixed_latency: "1"
        volume: "L"
        throughput: "128"
    matmul_large: &matmul_large
      simple:
        fixed_latency: "M * N / 2"
        volume: "2 * M * N * K"
        throughput: "716"
    matmul_small: &matmul_small
      simple:
        fixed_latency: "M * N / 2"
        volume: "2 * M * N * K"
        throughput: "M * N * 716 / 8192"
    batch_matmul_large: &batch_matmul_large
      simple:
        fixed_latency: "M * N / 2"
        volume: "2 * B * M * N * K"
        throughput: "716"
    batch_matmul_small: &batch_matmul_small
      simple:
        fixed_latency: "M * N / 2"
        volume: "2 * B * M * N * K"
        throughput: "M * N * 716 / 8192"
    matmul_rram_placeholder: &matmul_rram_placeholder
      simple:
        fixed_latency: "888"
        volume: "2 * M * N * K"
        throughput: "888"
    batch_matmul_rram_placeholder: &batch_matmul_rram_placeholder
      simple:
        fixed_latency: "888"
        volume: "2 * B * M * N * K"
        throughput: "888"

  functions:
    matmul_SS_f16:
      constraints: "M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - constraints: "M * N >= 8192"
          time_cost: *matmul_large
        - constraints: "M * N < 8192"
          time_cost: *matmul_small

    matmul_SR_f16:
      constraints: "M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - time_cost: *matmul_rram_placeholder

    matmul_RS_f16:
      constraints: "M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - time_cost: *matmul_rram_placeholder

    matmul_RR_f16:
      constraints: "M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - time_cost: *matmul_rram_placeholder

    batch_matmul_SS_f16:
      constraints: "B >= 1 && M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - constraints: "M * N >= 8192"
          time_cost: *batch_matmul_large
        - constraints: "M * N < 8192"
          time_cost: *batch_matmul_small

    batch_matmul_SR_f16:
      constraints: "B >= 1 && M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - time_cost: *batch_matmul_rram_placeholder

    batch_matmul_RS_f16:
      constraints: "B >= 1 && M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - time_cost: *batch_matmul_rram_placeholder

    batch_matmul_RR_f16:
      constraints: "B >= 1 && M >= 32 && N >= 32 && K >= 32"
      scenarios:
        - time_cost: *batch_matmul_rram_placeholder

    vec_vsum_f16:
      scenarios:
        - time_cost: *vector_reduce_f16

    vec_vmax_f16:
      scenarios:
        - time_cost: *vector_reduce_f16

    vec_max1_f16:
      scenarios:
        - time_cost: *vec_max1_f16

    elementwise_add_f16:
      scenarios:
        - time_cost: *elementwise_add_f16

    elementwise_mul_f16:
      scenarios:
        - time_cost: *elementwise_mul_f16
